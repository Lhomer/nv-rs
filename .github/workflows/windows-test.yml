name: Windows test room
# The Windows physics test room (docs/WINDOWS-ROOM.md): the Play package built as the room's
# (scripts/package-playtest.ps1 -TestBuild with NV_RS_ROOM=1): its Play.exe starts the game straight
# into the same Test Range room as the Android and Linux builds (crates/host/src/phone_range.rs),
# with F9 / Record-button clips (crates/host/src/room_record.rs); its Launcher.exe updates from the
# release below (windows-latest.txt). No game files are in it: it reads the player's own install.
#
# On a claude/** branch a second job publishes it at a stable link, the rolling prerelease tagged
# windows-test (its files replaced by each successful build):
# https://github.com/Lhomer/nv-rs/releases/download/windows-test/nv-rs-windows-room.zip
#
# Built for every push, as Play's package is (no paths filter): Launcher.exe's "Launch physics
# tester" waits for the tester of Play's newest build (scripts/updater/src/update.rs
# `tester_step`), so a push only Play built (a docs change) left it waiting for a tester that
# never came.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: package
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: 0
      # The room's Play.exe and Launcher.exe (scripts/launcher, scripts/updater), and the clips'
      # commit (crates/host/src/room_record.rs).
      NV_RS_ROOM: '1'
      NV_RS_UPDATE_REPO: ${{ github.repository }}
      NV_RS_UPDATE_TAG: windows-test
      NV_RS_UPDATE_LATEST: windows-latest.txt
      NV_RS_COMMIT: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust tools (rust-toolchain.toml) and the 32-bit target
        run: |
          rustup toolchain install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $toolchain = (rustup show active-toolchain) -split ' ' | Select-Object -First 1
          rustup target add i686-pc-windows-msvc --toolchain $toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: windows-room
          cache-all-crates: true
      - name: Name the build
        run: |
          $branch = '${{ github.ref_name }}' -replace '[^A-Za-z0-9._-]', '-'
          $short = '${{ github.sha }}'.Substring(0, 7)
          "PACKAGE_VERSION=room-$branch-$short" >> $env:GITHUB_ENV
      - name: Test the updater (Launcher.exe) as the room's
        run: |
          cargo test --locked --manifest-path scripts/updater/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the room's package (scripts/package-playtest.ps1 -TestBuild, NV_RS_ROOM=1)
        run: |
          ./scripts/package-playtest.ps1 -Version $env:PACKAGE_VERSION -TestBuild -Toolchain32 $env:TOOLCHAIN | Format-List
          "STAGE=dist/nv-rs-preview-$env:PACKAGE_VERSION-windows-x64-test" >> $env:GITHUB_ENV
      - name: Prepare the release files
        run: |
          # The room's guide in the package, then the package zipped under its stable name.
          Copy-Item -LiteralPath docs/WINDOWS-ROOM.md -Destination "$env:STAGE/ROOM README.md"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path $env:STAGE -DestinationPath release/nv-rs-windows-room.zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath release/nv-rs-windows-room.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nv-rs-windows-room.zip" | Set-Content -LiteralPath release/nv-rs-windows-room.zip.sha256 -Encoding ascii
          Copy-Item -LiteralPath "$env:STAGE/BUILD.txt" -Destination release/BUILD.txt
          $bytes = (Get-Item -LiteralPath release/nv-rs-windows-room.zip).Length
          @("commit=${{ github.sha }}", "version=$env:PACKAGE_VERSION", 'zip=nv-rs-windows-room.zip', "bytes=$bytes", "sha256=$hash") |
            Set-Content -LiteralPath release/windows-latest.txt -Encoding ascii
          Get-Content release/windows-latest.txt
      - name: Upload the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-room
          path: release
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-room
          path: release
      - name: Publish the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="windows-test"
          short="${GITHUB_SHA:0:7}"
          title="nv-rs Windows test room ($short)"
          notes="$(printf '%s\n' \
            "The Windows physics test room of the branch \`$GITHUB_REF_NAME\`, replaced by each successful build. Launcher.exe in the package updates from here." \
            "" \
            "- Commit: $GITHUB_SHA ($short)" \
            "- A test build: no game files are in it; it reads your own Fallout: New Vegas 1.4.0.525 install. ROOM README.md in the package (docs/WINDOWS-ROOM.md) says how to use it." \
            "" \
            "Files: nv-rs-windows-room.zip (the package), its SHA-256, BUILD.txt, windows-latest.txt (the build's commit; what Launcher.exe reads).")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
          fi
          # The package first, windows-latest.txt last: a launcher reads it, then fetches the rest.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            release/nv-rs-windows-room.zip release/nv-rs-windows-room.zip.sha256 release/BUILD.txt
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/windows-latest.txt
