[package]
name = "ragdoll-lab"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "A browser lab for the active ragdoll: capsule mannequins on Rapier, driven by the game's own flinch, balance, bracing and knockdown code (crates/ragdoll-core)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ragdoll-core = { path = "../../crates/ragdoll-core" }
rapier3d = "0.36"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Standalone tool, not part of the root workspace (its own lock; built for wasm32 by
# .github/workflows/ragdoll-lab-pages.yml).
[workspace]
