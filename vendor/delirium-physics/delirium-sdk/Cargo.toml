# Vendored from PVCPC/delirium-physics 23aea85b (vendor/README.md): the workspace fields written out, an rlib only.
[package]
name = "delirium-sdk"
version = "0.9.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "delirium_physics"
# nv-rs: an rlib only (the bridge links it as Rust; no shared library is built or shipped).
crate-type = ["rlib"]

[dependencies]
delirium = { path = "../delirium" }
delirium-data = { path = "../delirium-data" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
